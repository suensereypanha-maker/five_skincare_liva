name: Deploy homepage preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://suensereypanha-maker.github.io/five_skincare_liva
      ASSET_URL: https://suensereypanha-maker.github.io/five_skincare_liva
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, ctype, fileinfo, xml
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          composer install --no-dev --prefer-dist --no-interaction --no-progress
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Render pages and collect static assets
        run: |
          mkdir -p site
          cp -r public/* site/
          rm -f site/index.php

          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/liva-pages-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ --output site/index.html; then
              break
            fi
            sleep 1
          done

          if [ ! -s site/index.html ]; then
            cat /tmp/liva-pages-server.log
            exit 1
          fi

          pages=(
            "shop"
            "shop-details"
            "cart"
            "checkout"
            "checkout/success"
            "contact"
            "blog"
            "blog-details"
            "login"
            "register"
          )

          for p in "${pages[@]}"; do
            mkdir -p "site/$p"
            curl --fail --silent "http://127.0.0.1:8000/$p" --output "site/$p/index.html" || true
            cp "site/$p/index.html" "site/$p.html" 2>/dev/null || true
          done

          for id in $(seq 0 9); do
            mkdir -p "site/shop/$id"
            curl --fail --silent "http://127.0.0.1:8000/shop/$id" --output "site/shop/$id/index.html" || true
            cp "site/shop/$id/index.html" "site/shop/$id.html" 2>/dev/null || true
          done

          for id in 1 2 3; do
            mkdir -p "site/blog/$id"
            curl --fail --silent "http://127.0.0.1:8000/blog/$id" --output "site/blog/$id/index.html" || true
            cp "site/blog/$id/index.html" "site/blog/$id.html" 2>/dev/null || true
          done

          find site -type f -name "*.html" -exec sed -i 's#http://127.0.0.1:8000#https://suensereypanha-maker.github.io/five_skincare_liva#g' {} +
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
